name: 태스크
description: 하루 이하 작업. PR 1개와 짝을 이룬다.
title: "[KEY-?] "
body:
  - type: input
    id: jira
    attributes:
      label: Jira 스토리 키
      description: 제목의 [KEY-?]도 이 키로 바꾼다
      placeholder: FORM-3
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 확인할 수 있는 문장으로 쓴다
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options: [web, api, contract, docs, infra, spike]
    validations:
      required: true
